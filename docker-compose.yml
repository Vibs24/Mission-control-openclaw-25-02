version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pulsedesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data, ./infra/migrations:/docker-entrypoint-initdb.d]
  redis:
    image: redis:7
    ports: ['6379:6379']
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    ports: ['4000:4000']
    depends_on: [postgres, redis]
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports: ['5173:80']
    depends_on: [api]
  prometheus:
    image: prom/prometheus
    volumes: ['./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml']
    ports: ['9090:9090']
  grafana:
    image: grafana/grafana
    ports: ['3001:3000']
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
volumes:
  pgdata:
