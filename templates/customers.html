{% extends 'base.html' %}{% block body %}
<h2>Customers</h2>
<form method="post" class="inline"><input name="name" placeholder="name" required><input name="phone" placeholder="phone"><input name="email" placeholder="email"><select name="branch_id">{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select><button>Add</button></form>
<form><input name="q" value="{{ q }}" placeholder="search"/><button>Filter</button></form>
<table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Branch</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.phone}}</td><td>{{r.email}}</td><td>{{r.branch}}</td></tr>{% endfor %}</table>{% include 'partials_pager.html' %}
{% endblock %}
