{% extends 'base.html' %}{% block body %}
<h2>Purchases</h2>
<form method="post" class="inline">
<select name="branch_id">{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select>
<select name="vendor_id"><option value="">No Vendor</option>{% for v in vendors %}<option value="{{v.id}}">{{v.name}}</option>{% endfor %}</select>
<select name="product_id">{% for p in products %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select>
<input type="number" name="qty" min="1" value="1" required><input type="number" step="0.01" name="unit_cost" value="1" required><button>Add Purchase</button>
</form>
<table><tr><th>ID</th><th>Date</th><th>Branch</th><th>Vendor</th><th>Product</th><th>Qty</th><th>Unit Cost</th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.created_at}}</td><td>{{r.branch}}</td><td>{{r.vendor or '-'}}</td><td>{{r.product}}</td><td>{{r.qty}}</td><td>{{r.unit_cost}}</td></tr>{% endfor %}</table>{% include 'partials_pager.html' %}
{% endblock %}
