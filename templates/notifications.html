{% extends 'base.html' %}{% block body %}
<h2>Notification Center</h2>
<table><tr><th>Time</th><th>Level</th><th>Message</th><th>Status</th><th>Action</th></tr>{% for r in rows %}<tr><td>{{r.created_at}}</td><td>{{r.level}}</td><td>{{r.message}}</td><td>{{'Read' if r.is_read else 'Unread'}}</td><td>{% if not r.is_read %}<form method="post"><input type="hidden" name="id" value="{{r.id}}"><button>Mark read</button></form>{% endif %}</td></tr>{% endfor %}</table>
{% endblock %}
