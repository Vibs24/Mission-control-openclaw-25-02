openapi: 3.0.3
info:
  title: PulseDesk API
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
paths:
  /health:
    get:
      responses: { '200': { description: OK } }
  /auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses: { '200': { description: JWT token } }
  /tickets:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: List tickets } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
