{% extends 'base.html' %}
{% block content %}
<section class="card"><h2>Audit Log Timeline</h2>
<p><a href="{{ url_for('export_csv', entity='audit') }}">Export CSV</a></p>
<ul class="timeline">{% for l in logs %}<li><strong>{{ l['created_at'] }}</strong> - {{ l['username'] or 'system' }} - {{ l['action'] }} {{ l['entity'] }} ({{ l['details'] }})</li>{% endfor %}</ul>
</section>
{% endblock %}
