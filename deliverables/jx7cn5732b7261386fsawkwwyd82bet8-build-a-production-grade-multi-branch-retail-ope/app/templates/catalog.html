{% extends 'base.html' %}{% block content %}
<div class='card'><h3>Product Catalog</h3><form method='post' class='inline'><input name='sku' placeholder='SKU' required><input name='name' placeholder='Name' required><input name='cost_price' type='number' step='0.01' placeholder='Cost' required><input name='sell_price' type='number' step='0.01' placeholder='Sell' required><button>Add</button></form></div>
<div class='card'><form method='get' class='inline'><input name='q' value='{{q}}' placeholder='Search sku/name'><button>Search</button></form><table><thead><tr><th>SKU</th><th>Name</th><th>Cost</th><th>Sell</th></tr></thead><tbody>{% for p in pagination.items %}<tr><td>{{p.sku}}</td><td>{{p.name}}</td><td>{{p.cost_price}}</td><td>{{p.sell_price}}</td></tr>{% endfor %}</tbody></table>{% include '_pagination.html' %}</div>
{% endblock %}
