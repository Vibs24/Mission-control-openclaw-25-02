{% extends 'base.html' %}{% block content %}
<div class='row g-2'>{% for k,v in kpi.items() %}<div class='col-md-3'><div class='card'><div class='card-body'><small>{{k}}</small><h4>{{v}}</h4></div></div></div>{% endfor %}</div>
<h5 class='mt-3'>Low Stock Alerts</h5><ul>{% for i in low %}<li>{{i.branch.name}} - {{i.product.name}} ({{i.qty}})</li>{% else %}<li>No low stock</li>{% endfor %}</ul>
{% endblock %}
