{% extends 'base.html' %}{% block content %}
<div class='card'><h3>Purchase Intake</h3><form method='post' class='inline'><select name='branch_id'>{% for b in branches %}<option value='{{b.id}}'>{{b.name}}</option>{% endfor %}</select><select name='vendor_id'>{% for v in vendors %}<option value='{{v.id}}'>{{v.name}}</option>{% endfor %}</select><select name='product_id'>{% for p in products %}<option value='{{p.id}}'>{{p.name}}</option>{% endfor %}</select><input name='qty' type='number' required><input name='unit_cost' type='number' step='0.01' required><button>Record</button></form></div>
<div class='card'><table><thead><tr><th>ID</th><th>Branch</th><th>Vendor</th><th>Product</th><th>Qty</th><th>Cost</th><th>Date</th></tr></thead><tbody>{% for p in pagination.items %}<tr><td>{{p.id}}</td><td>{{p.branch.name}}</td><td>{{p.vendor.name}}</td><td>{{p.product.name}}</td><td>{{p.qty}}</td><td>{{p.unit_cost}}</td><td>{{p.purchased_on}}</td></tr>{% endfor %}</tbody></table>{% include '_pagination.html' %}</div>
{% endblock %}
