{% extends 'base.html' %}{% block content %}<h4>Purchases</h4>
<form method='post' class='row g-1 mb-3'><div class='col'><select class='form-select' name='branch_id'>{% for b in branches %}<option value='{{b.id}}'>{{b.name}}</option>{% endfor %}</select></div><div class='col'><select class='form-select' name='vendor_id'>{% for v in vendors %}<option value='{{v.id}}'>{{v.name}}</option>{% endfor %}</select></div><div class='col'><select class='form-select' name='product_id'>{% for p in products %}<option value='{{p.id}}'>{{p.name}}</option>{% endfor %}</select></div><div class='col'><input class='form-control' name='qty' placeholder='Qty'></div><div class='col'><input class='form-control' name='unit_cost' placeholder='Unit Cost'></div><div class='col-auto'><button class='btn btn-success'>Record</button></div></form>
<table class='table table-sm'><tr><th>ID</th><th>Branch</th><th>Product</th><th>Qty</th><th>Cost</th></tr>{% for r in rows.items %}<tr><td>{{r.id}}</td><td>{{r.branch_id}}</td><td>{{r.product_id}}</td><td>{{r.qty}}</td><td>{{r.unit_cost}}</td></tr>{% endfor %}</table>{% include '_p.html' %}
{% endblock %}
