{% extends 'base.html' %}{% block content %}
<div class='card'><h3>Branch Inventory</h3><form method='post' class='inline'><select name='branch_id'>{% for b in branches %}<option value='{{b.id}}'>{{b.name}}</option>{% endfor %}</select><select name='product_id'>{% for p in products %}<option value='{{p.id}}'>{{p.sku}} - {{p.name}}</option>{% endfor %}</select><input name='qty' type='number' min='0' placeholder='Qty' required><input name='reorder_level' type='number' min='1' value='5' required><button>Add/Set</button></form></div>
<div class='card'><form method='get' class='inline'><select name='branch_id'><option value=''>All branches</option>{% for b in branches %}<option value='{{b.id}}' {% if selected_branch==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select><button>Filter</button><a class='btn' href='{{url_for("main.export_csv", name="inventory")}}'>CSV</a></form>
<table><thead><tr><th>Branch</th><th>SKU</th><th>Product</th><th>Qty</th><th>Reorder</th></tr></thead><tbody>{% for i in pagination.items %}<tr><td>{{i.branch.name}}</td><td>{{i.product.sku}}</td><td>{{i.product.name}}</td><td>{{i.qty}}</td><td>{{i.reorder_level}}</td></tr>{% endfor %}</tbody></table>{% include '_pagination.html' %}</div>
{% endblock %}
