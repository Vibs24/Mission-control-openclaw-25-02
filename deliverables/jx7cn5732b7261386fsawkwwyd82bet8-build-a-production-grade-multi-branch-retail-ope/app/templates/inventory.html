{% extends 'base.html' %}{% block content %}<div class='d-flex justify-content-between'><h4>Inventory</h4><a class='btn btn-outline-secondary btn-sm' href='/export/inventory.csv'>CSV</a></div>
<form class='mb-2'><input class='form-control' name='q' value='{{q}}' placeholder='Search product'></form>
<form method='post' class='row g-1 mb-3'><div class='col'><select class='form-select' name='branch_id'>{% for b in branches %}<option value='{{b.id}}'>{{b.name}}</option>{% endfor %}</select></div><div class='col'><select class='form-select' name='product_id'>{% for p in products %}<option value='{{p.id}}'>{{p.name}}</option>{% endfor %}</select></div><div class='col'><input class='form-control' name='qty' placeholder='Qty'></div><div class='col'><input class='form-control' name='reorder_level' placeholder='Reorder'></div><div class='col-auto'><button class='btn btn-success'>Save</button></div></form>
<table class='table table-sm'><tr><th>Branch</th><th>Product</th><th>Qty</th><th>Reorder</th></tr>{% for r in rows.items %}<tr><td>{{r.branch.name}}</td><td>{{r.product.name}}</td><td>{{r.qty}}</td><td>{{r.reorder_level}}</td></tr>{% endfor %}</table>{% include '_p.html' %}
{% endblock %}
