{% extends 'base.html' %}{% block content %}<div class='d-flex justify-content-between'><h4>Sales</h4><a class='btn btn-outline-secondary btn-sm' href='/export/sales.csv'>CSV</a></div>
<form method='post' class='row g-1 mb-3'><div class='col'><select class='form-select' name='branch_id'>{% for b in branches %}<option value='{{b.id}}'>{{b.name}}</option>{% endfor %}</select></div><div class='col'><select class='form-select' name='customer_id'>{% for c in customers %}<option value='{{c.id}}'>{{c.name}}</option>{% endfor %}</select></div><div class='col'><select class='form-select' name='product_id'>{% for p in products %}<option value='{{p.id}}'>{{p.name}}</option>{% endfor %}</select></div><div class='col'><input class='form-control' name='qty' placeholder='Qty'></div><div class='col'><input class='form-control' name='unit_price' placeholder='Unit Price'></div><div class='col-auto'><button class='btn btn-success'>Sell</button></div></form>
<table class='table table-sm'><tr><th>ID</th><th>Branch</th><th>Product</th><th>Qty</th><th>Price</th><th>Invoice</th></tr>{% for r in rows.items %}<tr><td>{{r.id}}</td><td>{{r.branch_id}}</td><td>{{r.product_id}}</td><td>{{r.qty}}</td><td>{{r.unit_price}}</td><td><a href='/invoice/{{r.id}}'>View</a></td></tr>{% endfor %}</table>{% include '_p.html' %}
{% endblock %}
