{% extends 'base.html' %}{% block content %}<h4>Master Data</h4>
<div class='row'><div class='col-md-4'><form method='post'><input type='hidden' name='kind' value='product'><h6>Product</h6><input class='form-control mb-1' name='sku' placeholder='SKU' required><input class='form-control mb-1' name='name' placeholder='Name' required><input class='form-control mb-1' name='cost_price' placeholder='Cost' required><input class='form-control mb-1' name='sell_price' placeholder='Sell' required><button class='btn btn-primary btn-sm'>Add Product</button></form></div>
<div class='col-md-4'><form method='post'><input type='hidden' name='kind' value='customer'><h6>Customer</h6><input class='form-control mb-1' name='name' required><input class='form-control mb-1' name='phone'><button class='btn btn-primary btn-sm'>Add Customer</button></form></div>
<div class='col-md-4'><form method='post'><input type='hidden' name='kind' value='vendor'><h6>Vendor</h6><input class='form-control mb-1' name='name' required><input class='form-control mb-1' name='phone'><button class='btn btn-primary btn-sm'>Add Vendor</button></form></div></div>
{% endblock %}
