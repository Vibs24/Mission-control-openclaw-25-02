<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='{{url_for("static",filename="style.css")}}'><script src='{{url_for("static",filename="app.js")}}' defer></script><title>TeamFlow</title></head><body>
<nav><a href='{{url_for("workspaces")}}'>TeamFlow</a>{% if session.get('user_id') %}<a href='{{url_for("logout")}}'>Logout</a>{% endif %}</nav>
<main>{% with m=get_flashed_messages(with_categories=true) %}{% for c,t in m %}<div class='alert {{c}}'>{{t}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</body></html>
