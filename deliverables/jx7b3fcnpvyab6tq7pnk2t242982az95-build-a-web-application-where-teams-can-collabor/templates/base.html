<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TeamFlow</title><link rel='stylesheet' href='{{ url_for("static", filename="styles.css") }}'></head><body><header><h1>TeamFlow</h1><nav>{% if session.get('uid') %}<a href='{{ url_for("board") }}'>Board</a><a href='{{ url_for("admin_overview") }}'>Admin</a><a href='{{ url_for("logout") }}'>Logout</a>{% else %}<a href='{{ url_for("login") }}'>Login</a><a href='{{ url_for("signup") }}'>Signup</a>{% endif %}</nav></header><main>{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<p class='msg {{c}}'>{{m}}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
