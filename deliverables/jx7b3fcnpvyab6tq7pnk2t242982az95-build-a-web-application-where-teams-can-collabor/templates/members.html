{% extends 'base.html' %}{% block content %}<h2>Members</h2>{% if my_role=='admin' %}<form method='post' action='{{url_for("invite",workspace_id=workspace_id)}}' class='inline'><input name='email' type='email' placeholder='Invitee email'><select name='role'><option value='member'>Member</option><option value='admin'>Admin</option></select><button>Invite</button></form>{% endif %}<table><tr><th>Email</th><th>Role</th><th>In progress</th><th></th></tr>{% for r in rows %}<tr><td>{{r.email}}</td><td>{{r.role}}</td><td>{{r.in_progress}}</td><td>{% if my_role=='admin' %}<form method='post' action='{{url_for("remove_member",workspace_id=workspace_id,user_id=r.id)}}'><button>Remove</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
