{% extends 'base.html' %}{% block content %}<h4>Workspace Members</h4>{% if admin %}<form method='post' class='row g-2 mb-3'><div class='col'><input class='form-control' name='email' placeholder='Invite member by email'></div><div class='col-auto'><button class='btn btn-primary'>Invite</button></div></form>{% endif %}<table class='table table-sm'><tr><th>Email</th><th>Role</th><th></th></tr>{% for m in rows %}<tr><td>{{users[m.user_id].email}}</td><td>{{m.role}}</td><td>{% if admin %}<form method='post' action='/workspace/member/{{m.id}}/remove'><button class='btn btn-danger btn-sm'>Remove</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
