{% extends 'base.html' %}{% block content %}<div class='card'><h3>{{ws.name}} Members</h3>{% if is_admin %}<form method='post' class='inline'><input name='email' type='email' placeholder='Invite by email' required><button>Invite</button></form>{% endif %}</div><div class='card'><table><thead><tr><th>Email</th><th>Role</th><th>In Progress</th><th></th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.user.email}}</td><td>{{r.member.role}}</td><td>{{r.in_progress}}</td><td>{% if is_admin %}<form method='post' action='{{url_for("main.remove_member", workspace_id=ws.id, user_id=r.user.id)}}'><button>Remove</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
