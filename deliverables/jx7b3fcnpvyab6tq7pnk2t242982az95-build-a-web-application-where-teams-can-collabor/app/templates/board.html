{% extends 'base.html' %}{% block content %}<div class='card'><div class='inline'><h3>Task Board</h3><a class='btn' href='{{url_for("main.members", workspace_id=workspace_id)}}'>Manage Members</a></div><form method='post' class='inline'><input name='title' placeholder='Task title' required><input name='description' placeholder='Description'><input name='due_date' type='date'><select name='priority'><option>Low</option><option selected>Medium</option><option>High</option></select><select name='assignee_id'><option value=''>Unassigned</option>{% for u in users %}<option value='{{u.id}}'>{{u.email}}</option>{% endfor %}</select><button>Add Task</button></form></div><div class='board'>{% for status in ['Todo','In Progress','Done'] %}<div class='column' data-status='{{status}}'><h4>{{status}}</h4>{% for t in columns[status] %}<div class='task' draggable='true' data-task-id='{{t.id}}'><a href='{{url_for("main.task_detail", task_id=t.id)}}'><b>{{t.title}}</b></a><p>{{t.priority}}{% if t.due_date %} · due {{t.due_date}}{% endif %}</p></div>{% endfor %}</div>{% endfor %}</div>{% endblock %}
