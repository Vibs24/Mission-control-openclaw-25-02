<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TeamFlow</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><style>.col-board{min-height:320px;background:#f8f9fa;border:1px solid #ddd;border-radius:8px;padding:8px}.task{background:#fff;border:1px solid #ccc;border-radius:6px;padding:6px;margin:6px 0;cursor:grab}</style></head><body><nav class='navbar navbar-dark bg-dark navbar-expand-lg mb-3'><div class='container-fluid'><a class='navbar-brand' href='/board'>TeamFlow</a><div class='navbar-nav'><a class='nav-link' href='/workspaces'>Workspaces</a><a class='nav-link' href='/workspace/members'>Members</a><a class='nav-link' href='/admin/overview'>Overview</a><a class='nav-link' href='/notifications'>Notifications</a><a class='nav-link' href='/logout'>Logout</a></div></div></nav><div class='container'>{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class='alert alert-{{c}}'>{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div><script src='{{url_for("static",filename="app.js")}}'></script></body></html>
