<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>TeamFlow</title><link rel='stylesheet' href='{{url_for("static", filename="style.css")}}'><script defer src='{{url_for("static", filename="app.js")}}'></script></head><body><nav><h2>TeamFlow</h2>{% if current_user.is_authenticated %}<div class='links'><a href='{{url_for("main.workspaces")}}'>Workspaces</a><a href='{{url_for("main.notifications")}}'>Notifications</a><a href='{{url_for("main.logout")}}'>Logout</a></div>{% endif %}</nav><main>{% with messages = get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class='alert {{c}}'>{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
