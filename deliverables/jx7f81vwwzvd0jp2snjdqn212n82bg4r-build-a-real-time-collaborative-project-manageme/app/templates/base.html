<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Editorial PM</title><link rel='stylesheet' href='{{ url_for("static", filename="style.css") }}'><script defer src='{{ url_for("static", filename="app.js") }}'></script></head><body class='dark'>
<header class='topbar'><input id='globalSearch' placeholder='Search tasks...'><a href='{{ url_for("board") }}'>Board</a><a href='{{ url_for("members") }}'>Members</a><a href='{{ url_for("activity_feed") }}'>Activity</a><a href='{{ url_for("notifications") }}'>🔔</a><a href='{{ url_for("workspaces") }}'>Workspaces</a><a href='{{ url_for("logout") }}'>Logout</a></header>
<main>{% with m=get_flashed_messages(with_categories=true) %}{% for c,msg in m %}<p class='flash {{c}}'>{{msg}}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
