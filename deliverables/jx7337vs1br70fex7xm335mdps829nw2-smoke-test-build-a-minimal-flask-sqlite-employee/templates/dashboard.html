<!doctype html><html><body>
<h2>Employee Notes</h2>
<a href="{{ url_for('logout') }}">Logout</a>
<h3>Add Employee</h3>
<form method="post" action="{{ url_for('create_employee') }}">
<input name="name" placeholder="Name" required>
<input name="email" placeholder="Email" required>
<button>Add</button>
</form>
<hr>
{% for e in employees %}
<div style="border:1px solid #ccc;padding:8px;margin:8px 0">
  <strong>{{e.name}}</strong> ({{e.email}})
  <form style="display:inline" method="post" action="{{ url_for('delete_employee', employee_id=e.id) }}"><button>Delete Employee</button></form>
  <ul>
  {% for n in e.notes %}
    <li>{{n.content}} <form style="display:inline" method="post" action="{{ url_for('delete_note', note_id=n.id) }}"><button>x</button></form></li>
  {% endfor %}
  </ul>
  <form method="post" action="{{ url_for('add_note', employee_id=e.id) }}">
    <input name="content" placeholder="Add note" required>
    <button>Add Note</button>
  </form>
</div>
{% endfor %}
</body></html>
