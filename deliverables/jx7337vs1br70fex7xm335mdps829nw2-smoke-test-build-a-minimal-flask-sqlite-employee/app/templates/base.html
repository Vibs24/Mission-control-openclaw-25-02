<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Notes</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 900px; }
    nav { display:flex; gap:1rem; margin-bottom:1rem; }
    table { width:100%; border-collapse: collapse; }
    th, td { border:1px solid #ddd; padding:.5rem; }
    .error { color: #b00020; }
    input, textarea { width:100%; padding:.5rem; margin:.25rem 0 .75rem; }
    .btn { padding:.4rem .8rem; border:1px solid #444; background:#f6f6f6; cursor:pointer; text-decoration:none; color:black; }
    form.inline { display:inline; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    {% if session.get('user') %}
      <span>Logged in as {{ session['user'] }}</span>
      <a href="{{ url_for('logout') }}">Logout</a>
    {% endif %}
  </nav>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="{{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
