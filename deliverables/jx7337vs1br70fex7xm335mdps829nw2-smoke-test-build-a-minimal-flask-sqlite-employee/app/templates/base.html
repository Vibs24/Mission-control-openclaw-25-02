<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Notes</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f4f6; margin:0; }
    nav { background:#111827; color:#fff; padding:12px 16px; display:flex; justify-content:space-between; }
    nav a { color:#c7d2fe; margin-left:12px; text-decoration:none; }
    main { max-width:900px; margin:16px auto; padding:0 12px; }
    .card { background:#fff; border-radius:10px; padding:14px; margin-bottom:12px; }
    form { display:grid; gap:8px; }
    input, select, textarea, button, .btn { padding:8px; border-radius:8px; border:1px solid #d1d5db; }
    button, .btn { border:none; background:#2563eb; color:#fff; text-decoration:none; cursor:pointer; }
    .danger { background:#dc2626; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid #e5e7eb; padding:8px; text-align:left; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .flash { padding:8px; border-radius:8px; margin-bottom:8px; background:#e0f2fe; }
    @media (max-width:700px){ .row{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <nav>
    <strong>Employee Notes</strong>
    {% if current_user.is_authenticated %}
    <div>
      <a href="{{ url_for('main.employees') }}">Employees</a>
      <a href="{{ url_for('main.notes') }}">Notes</a>
      <a href="{{ url_for('main.logout') }}">Logout</a>
    </div>
    {% endif %}
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for _, msg in messages %}
      <div class="flash">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
