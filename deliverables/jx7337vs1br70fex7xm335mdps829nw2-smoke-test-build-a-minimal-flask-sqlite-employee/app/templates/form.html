{% extends 'base.html' %}
{% block content %}
<h2>{% if note %}Edit{% else %}Create{% endif %} Note</h2>
<form method="post">
  <label>Employee Name</label>
  <input name="employee_name" value="{{ note.employee_name if note else '' }}" required />
  <label>Title</label>
  <input name="title" value="{{ note.title if note else '' }}" required />
  <label>Content</label>
  <textarea name="content">{{ note.content if note else '' }}</textarea>
  <button class="btn" type="submit">Save</button>
</form>
{% endblock %}
