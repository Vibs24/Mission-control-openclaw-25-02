<!doctype html>
<html><body>
<h2>Employee Notes Login</h2>
{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<p>{{m}}</p>{% endfor %}{% endwith %}
<form method="post">
  <input name="username" placeholder="username" required>
  <input name="password" type="password" placeholder="password" required>
  <button type="submit">Login</button>
</form>
</body></html>
