{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h3>Add Note</h3>
  <form method="post" action="{{ url_for('main.notes') }}">
    <input name="title" placeholder="Title" required>
    <textarea name="body" rows="3" placeholder="Note body"></textarea>
    <select name="employee_id" required>
      {% for e in employees %}
      <option value="{{e.id}}">{{e.name}}</option>
      {% endfor %}
    </select>
    <button>Create</button>
  </form>
</div>

<div class="card">
  <h3>Notes</h3>
  <table>
    <thead><tr><th>Title</th><th>Employee</th><th>Created</th><th></th></tr></thead>
    <tbody>
      {% for n in notes %}
      <tr>
        <td>{{ n.title }}</td>
        <td>{{ n.employee.name }}</td>
        <td>{{ n.created_at }}</td>
        <td>
          <a class="btn" href="{{ url_for('main.edit_note', nid=n.id) }}">Edit</a>
          <form method="post" action="{{ url_for('main.delete_note', nid=n.id) }}" style="display:inline-block;">
            <button class="danger">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
