{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:520px;">
  <h3>Edit Note</h3>
  <form method="post">
    <input name="title" value="{{ note.title }}" required>
    <textarea name="body" rows="5">{{ note.body or '' }}</textarea>
    <select name="employee_id" required>
      {% for e in employees %}
      <option value="{{e.id}}" {% if note.employee_id==e.id %}selected{% endif %}>{{e.name}}</option>
      {% endfor %}
    </select>
    <button>Save</button>
    <a class="btn" href="{{ url_for('main.notes') }}">Cancel</a>
  </form>
</div>
{% endblock %}
