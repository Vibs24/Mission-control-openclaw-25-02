<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smoke E2E v2 Dashboard</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f8fafc;margin:24px;color:#0f172a}
    .wrap{max-width:760px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px}
    .ok{color:#166534;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:10px}
    .card{background:#f1f5f9;border-radius:8px;padding:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tiny Smoke Dashboard</h1>
    <p>Status: <span class="ok">Ready for Review</span></p>
    <div class="grid">
      <div class="card"><strong>Bundle</strong><br/>HTML + README</div>
      <div class="card"><strong>Validation</strong><br/>Files verified</div>
      <div class="card"><strong>Scope</strong><br/>Smoke E2E v2</div>
    </div>
  </div>
</body>
</html>
