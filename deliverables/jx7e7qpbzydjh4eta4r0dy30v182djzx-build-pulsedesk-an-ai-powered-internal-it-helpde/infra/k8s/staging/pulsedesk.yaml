apiVersion: apps/v1
kind: Deployment
metadata: { name: pulsedesk-api, namespace: staging }
spec:
  replicas: 2
  selector: { matchLabels: { app: pulsedesk-api } }
  template:
    metadata: { labels: { app: pulsedesk-api } }
    spec:
      containers:
        - name: api
          image: pulsedesk/api:staging
          ports: [{ containerPort: 4000 }]
---
apiVersion: v1
kind: Service
metadata: { name: pulsedesk-api, namespace: staging }
spec:
  selector: { app: pulsedesk-api }
  ports: [{ port: 80, targetPort: 4000 }]
