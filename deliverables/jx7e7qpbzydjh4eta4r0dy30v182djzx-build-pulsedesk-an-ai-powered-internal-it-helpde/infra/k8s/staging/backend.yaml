apiVersion: apps/v1
kind: Deployment
metadata: {name: pulsedesk-backend, namespace: staging}
spec:
  replicas: 2
  selector: {matchLabels: {app: pulsedesk-backend}}
  template:
    metadata: {labels: {app: pulsedesk-backend}}
    spec:
      containers:
      - name: backend
        image: pulsedesk/backend:staging
        ports: [{containerPort: 8080}]
