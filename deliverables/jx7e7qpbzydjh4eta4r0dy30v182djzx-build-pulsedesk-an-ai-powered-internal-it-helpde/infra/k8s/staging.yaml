apiVersion: apps/v1
kind: Deployment
metadata: {name: pulsedesk-backend-staging}
spec:
  replicas: 2
  selector: {matchLabels: {app: pulsedesk-backend}}
  template:
    metadata: {labels: {app: pulsedesk-backend}}
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/pulsedesk-backend:staging
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: pulsedesk-backend}
spec: {selector: {app: pulsedesk-backend}, ports: [{port: 80, targetPort: 8080}]}
