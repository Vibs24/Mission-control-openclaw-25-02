services:
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
  backend:
    build: ./backend
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [db, redis]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pulsedesk
      POSTGRES_USER: pulsedesk
      POSTGRES_PASSWORD: pulsedesk
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  prometheus:
    image: prom/prometheus
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3001:3000"]
  mailhog:
    image: mailhog/mailhog
    ports: ["8025:8025"]
