{% extends 'base.html' %}{% block content %}<div class='grid2'><div class='card'><h3>Attendance</h3><form method='post'><select name='employee_id'>{% for e in employees %}<option value='{{e.id}}'>{{e.full_name}}</option>{% endfor %}</select><input type='date' name='day' required><select name='status'><option>Present</option><option>Absent</option><option>WFH</option></select><input name='check_in' placeholder='09:05'><input name='check_out' placeholder='18:10'><button>Mark</button></form></div><div class='card'><h3>Filters</h3><form method='get' class='inline'><input type='date' name='day' value='{{day_filter or ""}}'><button>Apply</button><a class='btn' href='{{url_for("main.export_attendance_csv")}}'>Attendance CSV</a></form></div></div><div class='card'><table><thead><tr><th>Date</th><th>Employee</th><th>Status</th><th>In</th><th>Out</th></tr></thead><tbody>{% for a in pagination.items %}<tr><td>{{a.day}}</td><td>{{a.employee.full_name}}</td><td><span class='badge {{a.status|lower}}'>{{a.status}}</span></td><td>{{a.check_in}}</td><td>{{a.check_out}}</td></tr>{% endfor %}</tbody></table>{% include '_pagination.html' %}</div>{% endblock %}
