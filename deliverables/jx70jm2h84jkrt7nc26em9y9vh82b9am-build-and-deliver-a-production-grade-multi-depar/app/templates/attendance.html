{% extends 'base.html' %}{% block content %}<div class='d-flex justify-content-between'><h4>Attendance</h4><a class='btn btn-outline-secondary btn-sm' href='/export/attendance.csv'>CSV</a></div><form method='post' class='row g-1 mb-2'><div class='col'><select class='form-select' name='employee_id'>{% for e in employees %}<option value='{{e.id}}'>{{e.name}}</option>{% endfor %}</select></div><div class='col'><input type='date' class='form-control' name='day'></div><div class='col'><select class='form-select' name='status'><option>present</option><option>absent</option><option>late</option></select></div><div class='col-auto'><button class='btn btn-success'>Mark</button></div></form><table class='table table-sm'><tr><th>Employee</th><th>Day</th><th>Status</th></tr>{% for r in rows.items %}<tr><td>{{r.employee.name}}</td><td>{{r.day}}</td><td>{{r.status}}</td></tr>{% endfor %}</table>{% include '_p.html' %}{% endblock %}
