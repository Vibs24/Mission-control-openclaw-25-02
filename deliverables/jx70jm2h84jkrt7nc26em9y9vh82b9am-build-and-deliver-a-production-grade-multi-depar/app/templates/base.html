<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Workforce Command Center</title><link rel='stylesheet' href='{{url_for("static", filename="style.css")}}'></head><body><nav><h2>WCC</h2>{% if current_user.is_authenticated %}<div class='links'><a href='{{url_for("main.dashboard")}}'>Dashboard</a><a href='{{url_for("main.departments")}}'>Departments</a><a href='{{url_for("main.employees")}}'>Employees</a><a href='{{url_for("main.shifts")}}'>Shifts</a><a href='{{url_for("main.attendance")}}'>Attendance</a><a href='{{url_for("main.leaves")}}'>Leaves</a><a href='{{url_for("main.audit")}}'>Audit</a><a href='{{url_for("main.logout")}}'>Logout</a></div>{% endif %}</nav><main>{% with messages = get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class='alert {{c}}'>{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
