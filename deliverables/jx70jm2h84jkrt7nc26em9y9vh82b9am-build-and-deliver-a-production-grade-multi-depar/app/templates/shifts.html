{% extends 'base.html' %}{% block content %}<div class='card'><h3>Shift Planning</h3><form method='post' class='inline'><select name='employee_id'>{% for e in employees %}<option value='{{e.id}}'>{{e.full_name}}</option>{% endfor %}</select><input type='date' name='shift_date' required><input name='shift_name' placeholder='Morning/Evening' required><input name='start_time' placeholder='09:00' required><input name='end_time' placeholder='18:00' required><button>Assign</button></form></div><div class='card'><table><thead><tr><th>Date</th><th>Employee</th><th>Shift</th><th>Start</th><th>End</th></tr></thead><tbody>{% for s in pagination.items %}<tr><td>{{s.shift_date}}</td><td>{{s.employee.full_name}}</td><td>{{s.shift_name}}</td><td>{{s.start_time}}</td><td>{{s.end_time}}</td></tr>{% endfor %}</tbody></table>{% include '_pagination.html' %}</div>{% endblock %}
