{% extends 'base.html' %}{% block content %}<h4>Shift Planning</h4><form method='post' class='row g-1 mb-2'><div class='col'><select class='form-select' name='employee_id'>{% for e in employees %}<option value='{{e.id}}'>{{e.name}}</option>{% endfor %}</select></div><div class='col'><input type='date' class='form-control' name='shift_date'></div><div class='col'><input class='form-control' name='start_time' placeholder='09:00'></div><div class='col'><input class='form-control' name='end_time' placeholder='18:00'></div><div class='col-auto'><button class='btn btn-success'>Assign</button></div></form><table class='table table-sm'><tr><th>Employee</th><th>Date</th><th>Start</th><th>End</th></tr>{% for r in rows.items %}<tr><td>{{r.employee.name}}</td><td>{{r.shift_date}}</td><td>{{r.start_time}}</td><td>{{r.end_time}}</td></tr>{% endfor %}</table>{% include '_p.html' %}{% endblock %}
