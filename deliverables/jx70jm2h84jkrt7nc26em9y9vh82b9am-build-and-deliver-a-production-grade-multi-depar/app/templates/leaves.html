{% extends 'base.html' %}{% block content %}<h4>Leave Workflow</h4><form class='mb-2'><select class='form-select' name='status'><option value=''>All</option><option {% if status=='pending' %}selected{% endif %}>pending</option><option {% if status=='approved' %}selected{% endif %}>approved</option><option {% if status=='rejected' %}selected{% endif %}>rejected</option></select></form><form method='post' class='row g-1 mb-2'><div class='col'><select class='form-select' name='employee_id'>{% for e in employees %}<option value='{{e.id}}'>{{e.name}}</option>{% endfor %}</select></div><div class='col'><input type='date' class='form-control' name='start_date'></div><div class='col'><input type='date' class='form-control' name='end_date'></div><div class='col'><input class='form-control' name='reason' placeholder='Reason'></div><div class='col'><select class='form-select' name='status'><option>pending</option><option>approved</option><option>rejected</option></select></div><div class='col-auto'><button class='btn btn-success'>Submit</button></div></form><table class='table table-sm'><tr><th>Employee</th><th>From</th><th>To</th><th>Status</th><th>PDF</th></tr>{% for r in rows.items %}<tr><td>{{r.employee.name}}</td><td>{{r.start_date}}</td><td>{{r.end_date}}</td><td>{{r.status}}</td><td><a href='/export/leave/{{r.id}}.pdf'>Export</a></td></tr>{% endfor %}</table>{% include '_p.html' %}{% endblock %}
