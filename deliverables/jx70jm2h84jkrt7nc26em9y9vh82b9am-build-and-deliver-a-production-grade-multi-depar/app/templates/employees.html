{% extends 'base.html' %}{% block content %}<h4>Employees</h4><form class='mb-2'><input class='form-control' name='q' value='{{q}}' placeholder='Search employee/department'></form><form method='post' class='row g-1 mb-2'><div class='col'><input class='form-control' name='name' placeholder='Name'></div><div class='col'><input class='form-control' name='email' placeholder='Email'></div><div class='col'><input class='form-control' name='department' placeholder='Department'></div><div class='col'><select class='form-select' name='status'><option>active</option><option>inactive</option></select></div><div class='col-auto'><button class='btn btn-success'>Add</button></div></form><table class='table table-sm'><tr><th>Name</th><th>Email</th><th>Dept</th><th>Status</th><th></th></tr>{% for r in rows.items %}<tr><td>{{r.name}}</td><td>{{r.email}}</td><td>{{r.department}}</td><td>{{r.status}}</td><td><form method='post' action='/employees/{{r.id}}/delete'><button class='btn btn-danger btn-sm'>Delete</button></form></td></tr>{% endfor %}</table>{% include '_p.html' %}{% endblock %}
