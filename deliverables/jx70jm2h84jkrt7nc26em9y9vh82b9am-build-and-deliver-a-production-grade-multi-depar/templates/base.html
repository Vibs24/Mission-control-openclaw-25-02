<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Workforce Command Center</title><link rel='stylesheet' href='{{ url_for("static", filename="styles.css") }}'></head><body><header><h1>Workforce Command Center</h1>{% if session.get('user_id') %}<nav><a href='{{ url_for("dashboard") }}'>Dashboard</a><a href='{{ url_for("employees") }}'>Employees</a><a href='{{ url_for("shifts") }}'>Shifts</a><a href='{{ url_for("attendance") }}'>Attendance</a><a href='{{ url_for("leaves") }}'>Leaves</a><a href='{{ url_for("audit") }}'>Audit</a><a href='{{ url_for("logout") }}'>Logout</a></nav>{% endif %}</header><main>{% with m=get_flashed_messages(with_categories=true) %}{% for c,msg in m %}<p class='msg {{c}}'>{{msg}}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
