{% extends 'base.html' %}{% block content %}<section class='card'><h2>Shift Planning</h2><form method='post' class='grid2'><select name='employee_id'>{% for e in emps %}<option value='{{e["id"]}}'>{{e["name"]}}</option>{% endfor %}</select><input name='shift_date' type='date' required><input name='start_time' type='time' required><input name='end_time' type='time' required><select name='status'><option>planned</option><option>published</option></select><button>Save Shift</button></form><p><a href='{{ url_for("export_csv", entity="shifts") }}'>Export CSV</a></p><table><tr><th>Employee</th><th>Date</th><th>Start</th><th>End</th><th>Status</th></tr>{% for r in rows %}<tr><td>{{r['employee']}}</td><td>{{r['shift_date']}}</td><td>{{r['start_time']}}</td><td>{{r['end_time']}}</td><td>{{r['status']}}</td></tr>{% endfor %}</table></section>{% endblock %}
