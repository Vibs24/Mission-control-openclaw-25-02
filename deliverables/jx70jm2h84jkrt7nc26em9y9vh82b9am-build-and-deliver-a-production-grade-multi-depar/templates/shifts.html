{% extends 'base.html' %}{% block content %}<h2>Shift Planning</h2><div class="card"><form method="post"><input type="date" name="day" required><input name="start" value="09:00" required><input name="end" value="17:00" required><select name="employee_id">{% for e in employees %}<option value="{{e.id}}">{{e.name}}</option>{% endfor %}</select><button>Add Shift</button></form></div><div class="card"><table><tr><th>Day</th><th>Employee</th><th>Start</th><th>End</th></tr>{% for s in data.items %}<tr><td>{{s.day}}</td><td>{{s.employee.name}}</td><td>{{s.start}}</td><td>{{s.end}}</td></tr>{% endfor %}</table></div>{% endblock %}
