{% extends 'base.html' %}{% block content %}<section class='card'><h2>Leave Workflow</h2><form method='post' class='grid2'><select name='employee_id'>{% for e in emps %}<option value='{{e["id"]}}'>{{e["name"]}}</option>{% endfor %}</select><input name='leave_type' placeholder='annual/sick' required><input name='start_date' type='date' required><input name='end_date' type='date' required><input name='reason' placeholder='Reason'><select name='status'><option>pending</option><option>approved</option><option>rejected</option></select><button>Create Leave</button></form><p><a href='{{ url_for("export_csv", entity="leaves") }}'>Export CSV</a></p><table><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Status</th><th>Review</th></tr>{% for r in rows %}<tr><td>{{r['employee']}}</td><td>{{r['leave_type']}}</td><td>{{r['start_date']}}</td><td>{{r['end_date']}}</td><td>{{r['status']}}</td><td><form method='post' action='{{ url_for("review_leave", leave_id=r["id"]) }}'><select name='status'><option>approved</option><option>rejected</option></select><button>Apply</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
