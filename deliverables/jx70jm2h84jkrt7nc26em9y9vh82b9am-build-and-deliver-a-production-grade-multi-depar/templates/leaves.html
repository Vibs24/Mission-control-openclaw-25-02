{% extends 'base.html' %}{% block content %}<h2>Leave Workflow</h2><div class="card"><form method="post"><select name="employee_id">{% for e in employees %}<option value="{{e.id}}">{{e.name}}</option>{% endfor %}</select><input type="date" name="start_date" required><input type="date" name="end_date" required><select name="status"><option>pending</option><option>approved</option><option>rejected</option></select><input name="reason" placeholder="reason"><button>Create</button></form></div><div class="card"><table><tr><th>Employee</th><th>From</th><th>To</th><th>Status</th></tr>{% for l in data.items %}<tr><td>{{l.employee.name}}</td><td>{{l.start_date}}</td><td>{{l.end_date}}</td><td>{{l.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
