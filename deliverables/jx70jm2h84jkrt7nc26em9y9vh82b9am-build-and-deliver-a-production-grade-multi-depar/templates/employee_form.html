{% extends 'base.html' %}
{% block title %}{{ 'New' if mode == 'create' else 'Edit' }} Employee{% endblock %}
{% block content %}
<section class="page-head">
  <h1>{{ 'Create Employee' if mode == 'create' else 'Edit Employee' }}</h1>
  <div class="actions"><a class="btn-outline" href="{{ url_for('employees_list') }}">Back</a></div>
</section>

<form method="post" class="card form-grid two">
  <label>Employee Code
    <input type="text" name="employee_code" required value="{{ employee.employee_code or '' }}" />
  </label>
  <label>Full Name
    <input type="text" name="full_name" required value="{{ employee.full_name or '' }}" />
  </label>
  <label>Email
    <input type="email" name="email" required value="{{ employee.email or '' }}" />
  </label>
  <label>Department
    <input type="text" name="department" required value="{{ employee.department or '' }}" />
  </label>
  <label>Title
    <input type="text" name="title" required value="{{ employee.title or '' }}" />
  </label>
  <label>Status
    <select name="status">
      {% for st in ['Active', 'Inactive', 'On Leave'] %}
      <option value="{{ st }}" {% if (employee.status or 'Active') == st %}selected{% endif %}>{{ st }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Hourly Rate
    <input type="number" step="0.01" min="0" name="hourly_rate" value="{{ employee.hourly_rate if employee.hourly_rate is not none else 0 }}" />
  </label>
  <label>Hire Date
    <input type="date" name="hire_date" required value="{{ employee.hire_date or '' }}" />
  </label>
  <button type="submit">{{ 'Create' if mode == 'create' else 'Save Changes' }}</button>
</form>
{% endblock %}
