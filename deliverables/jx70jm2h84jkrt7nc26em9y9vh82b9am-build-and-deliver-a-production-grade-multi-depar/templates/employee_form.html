{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <h2>{% if employee %}Edit{% else %}Add{% endif %} Employee</h2>
  <form method="post">
    {% if not employee %}<label>Employee Code <input name="emp_code" required></label>{% endif %}
    <label>First Name <input name="first_name" value="{{employee['first_name'] if employee else ''}}" required></label>
    <label>Last Name <input name="last_name" value="{{employee['last_name'] if employee else ''}}" required></label>
    <label>Department <input name="department" value="{{employee['department'] if employee else ''}}" required></label>
    <label>Email <input name="email" type="email" value="{{employee['email'] if employee else ''}}" required></label>
    <label>Phone <input name="phone" value="{{employee['phone'] if employee else ''}}"></label>
    <label>Join Date <input name="join_date" type="date" value="{{employee['join_date'] if employee else ''}}" required></label>
    <label>Status
      <select name="status"><option {% if employee and employee['status']=='Active' %}selected{% endif %}>Active</option><option {% if employee and employee['status']=='Inactive' %}selected{% endif %}>Inactive</option></select>
    </label>
    <label>Base Salary <input name="base_salary" type="number" step="0.01" value="{{employee['base_salary'] if employee else ''}}" required></label>
    <button type="submit">Save</button>
  </form>
</section>
{% endblock %}
