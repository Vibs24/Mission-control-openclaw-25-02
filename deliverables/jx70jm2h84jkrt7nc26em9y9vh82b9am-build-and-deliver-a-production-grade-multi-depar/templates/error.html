{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if current_user %}
    <a href="{{ url_for('dashboard') }}">Back to dashboard</a>
  {% else %}
    <a href="{{ url_for('login') }}">Back to login</a>
  {% endif %}
</section>
{% endblock %}
