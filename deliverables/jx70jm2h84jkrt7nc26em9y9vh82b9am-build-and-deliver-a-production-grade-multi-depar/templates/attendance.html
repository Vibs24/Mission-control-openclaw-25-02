{% extends 'base.html' %}{% block content %}<section class='card'><h2>Attendance Workflow</h2><form method='post' class='grid2'><select name='employee_id'>{% for e in emps %}<option value='{{e["id"]}}'>{{e["name"]}}</option>{% endfor %}</select><input name='day' type='date' required><input name='check_in' type='time'><input name='check_out' type='time'><input name='hours' type='number' step='0.01' placeholder='Hours'><select name='status'><option>present</option><option>absent</option><option>late</option></select><button>Mark</button></form><p><a href='{{ url_for("export_csv", entity="attendance") }}'>Export CSV</a></p><table><tr><th>Employee</th><th>Day</th><th>In</th><th>Out</th><th>Hours</th><th>Status</th></tr>{% for r in rows %}<tr><td>{{r['employee']}}</td><td>{{r['day']}}</td><td>{{r['check_in']}}</td><td>{{r['check_out']}}</td><td>{{r['hours']}}</td><td>{{r['status']}}</td></tr>{% endfor %}</table></section>{% endblock %}
