{% extends 'base.html' %}{% block content %}<h2>Attendance</h2><div class="card"><form method="post"><input type="date" name="day" required><select name="employee_id">{% for e in employees %}<option value="{{e.id}}">{{e.name}}</option>{% endfor %}</select><select name="status"><option>present</option><option>absent</option></select><button>Mark</button></form><a href="{{url_for('export_att')}}">Export Attendance CSV</a></div><div class="card"><table><tr><th>Day</th><th>Employee</th><th>Status</th></tr>{% for r in data.items %}<tr><td>{{r.day}}</td><td>{{r.employee.name}}</td><td>{{r.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
