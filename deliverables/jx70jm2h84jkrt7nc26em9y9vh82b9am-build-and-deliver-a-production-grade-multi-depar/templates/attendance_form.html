{% extends 'base.html' %}
{% block title %}Record Attendance{% endblock %}
{% block content %}
<section class="page-head">
  <h1>Record Attendance</h1>
  <div class="actions"><a class="btn-outline" href="{{ url_for('attendance_list') }}">Back</a></div>
</section>

<form method="post" class="card form-grid two">
  <label>Employee
    <select name="employee_id" required>
      <option value="">Select employee</option>
      {% for e in employees %}
      <option value="{{ e.id }}" {% if (item.employee_id|string) == (e.id|string) %}selected{% endif %}>{{ e.full_name }} ({{ e.employee_code }})</option>
      {% endfor %}
    </select>
  </label>
  <label>Date
    <input type="date" name="attendance_date" required value="{{ item.attendance_date or today }}" />
  </label>
  <label>Check In
    <input type="time" name="check_in_time" value="{{ item.check_in_time or '' }}" />
  </label>
  <label>Check Out
    <input type="time" name="check_out_time" value="{{ item.check_out_time or '' }}" />
  </label>
  <label>Status
    <select name="status">
      {% for st in ['Present', 'Absent', 'Late', 'Leave'] %}
      <option value="{{ st }}" {% if (item.status or 'Present') == st %}selected{% endif %}>{{ st }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="full">Notes
    <textarea name="notes" rows="4">{{ item.notes or '' }}</textarea>
  </label>
  <button type="submit">Save Attendance</button>
</form>
{% endblock %}
