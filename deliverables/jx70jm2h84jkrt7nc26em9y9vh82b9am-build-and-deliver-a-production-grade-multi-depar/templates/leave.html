{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>Leave Workflow</h2>
  <form method="post" class="grid two">
    <label>Employee<select name="employee_id">{% for e in employees %}<option value="{{e['id']}}">{{e['emp_code']}} - {{e['first_name']}} {{e['last_name']}}</option>{% endfor %}</select></label>
    <label>Type<select name="leave_type"><option>Casual</option><option>Sick</option><option>Earned</option></select></label>
    <label>Start<input name="start_date" type="date" required></label>
    <label>End<input name="end_date" type="date" required></label>
    <label>Reason<input name="reason"></label>
    <button>Submit Leave</button>
  </form>
  <form method="get" class="filters"><select name="status"><option value="">All</option><option {% if status_f=='Pending' %}selected{% endif %}>Pending</option><option {% if status_f=='Approved' %}selected{% endif %}>Approved</option><option {% if status_f=='Rejected' %}selected{% endif %}>Rejected</option></select><button>Filter</button></form>
  <div class="table-wrap"><table><tr><th>Emp</th><th>Range</th><th>Type</th><th>Status</th><th>Action</th></tr>{% for r in rows %}<tr><td>{{r['emp_code']}} {{r['first_name']}}</td><td>{{r['start_date']}} to {{r['end_date']}}</td><td>{{r['leave_type']}}</td><td>{{r['status']}}</td><td>{% if r['status']=='Pending' %}<form method="post" action="{{url_for('leave_review', leave_id=r['id'])}}" style="display:inline"><input type="hidden" name="action" value="Approved"><button>Approve</button></form><form method="post" action="{{url_for('leave_review', leave_id=r['id'])}}" style="display:inline"><input type="hidden" name="action" value="Rejected"><button>Reject</button></form>{% endif %}</td></tr>{% endfor %}</table></div>
</section>
{% endblock %}
