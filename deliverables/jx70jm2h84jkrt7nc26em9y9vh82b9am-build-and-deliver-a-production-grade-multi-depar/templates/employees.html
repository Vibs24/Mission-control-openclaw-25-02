{% extends 'base.html' %}{% block content %}<section class='card'><h2>Employee CRUD</h2><form method='get'><input name='q' value='{{q}}' placeholder='Search name/code/email'><button>Filter</button></form><form method='post' class='grid2'><input name='emp_code' placeholder='Code' required><input name='name' placeholder='Name' required><input name='email' placeholder='Email'><input name='phone' placeholder='Phone'><select name='department_id'>{% for d in deps %}<option value='{{d["id"]}}'>{{d["name"]}}</option>{% endfor %}</select><input name='title' placeholder='Title'><input name='salary' type='number' step='0.01' placeholder='Salary' required><select name='status'><option>active</option><option>inactive</option></select><button>Add Employee</button></form><p><a href='{{ url_for("export_csv", entity="employees") }}'>Export CSV</a></p><table><tr><th>Code</th><th>Name</th><th>Department</th><th>Title</th><th>Status</th></tr>{% for r in rows %}<tr><td>{{r['emp_code']}}</td><td>{{r['name']}}</td><td>{{r['department']}}</td><td>{{r['title']}}</td><td>{{r['status']}}</td></tr>{% endfor %}</table><p>Page {{page}}/{{pages}}</p></section>{% endblock %}
