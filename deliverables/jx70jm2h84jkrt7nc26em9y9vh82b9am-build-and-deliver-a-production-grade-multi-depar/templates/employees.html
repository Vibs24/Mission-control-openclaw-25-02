{% extends 'base.html' %}{% block content %}<h2>Employee CRUD</h2><div class="card"><form method="get"><input name="q" value="{{s}}" placeholder="search"><select name="dep"><option value="">all dep</option>{% for d in deps %}<option value="{{d.id}}" {% if dep|int==d.id %}selected{% endif %}>{{d.name}}</option>{% endfor %}</select><button>Filter</button></form></div><div class="card"><form method="post"><input name="name" placeholder="Name" required><input name="email" placeholder="Email" required><select name="department_id"><option value="">No dept</option>{% for d in deps %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select><button>Create</button></form></div><div class="card"><table><tr><th>Name</th><th>Email</th><th>Dept</th><th></th></tr>{% for e in data.items %}<tr><td>{{e.name}}</td><td>{{e.email}}</td><td>{{e.department.name if e.department else '-'}}</td><td><form method="post" action="{{url_for('delete_employee',eid=e.id)}}"><button>Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
