{% extends 'base.html' %}
{% block title %}Login | Workforce Command Center{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="card auth-card">
    <h1>Secure Login</h1>
    <p class="muted">Sign in with your role account.</p>
    <form method="post" class="form-grid">
      <label>Username
        <input type="text" name="username" required autocomplete="username" />
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <button type="submit">Sign In</button>
    </form>
    <div class="hint">
      Default bootstrap account: <code>admin / admin123</code>
    </div>
  </div>
</section>
{% endblock %}
