{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-2"><h4>Employees</h4><a class="btn btn-outline-secondary" href="{{ url_for('export_csv', table='employees') }}">Export CSV</a></div>
<form class="row g-2 mb-2">
  <div class="col"><input class="form-control" name="q" value="{{q}}" placeholder="Search name/email"></div>
  <div class="col"><select class="form-select" name="status"><option value="">All status</option><option value="active">active</option><option value="inactive">inactive</option></select></div>
  <div class="col-auto"><button class="btn btn-primary">Filter</button></div>
</form>
<form method="post" class="row g-2 mb-3">
  <div class="col"><input class="form-control" name="full_name" placeholder="Full Name" required></div>
  <div class="col"><input class="form-control" name="email" placeholder="Email" required></div>
  <div class="col"><input class="form-control" name="role" placeholder="Role" required></div>
  <div class="col"><select class="form-select" name="department_id" required>{% for d in departments %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select></div>
  <div class="col-auto"><button class="btn btn-success">Add</button></div>
</form>
<table class="table table-striped table-sm"><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Status</th><th>Actions</th></tr>
{% for e in rows.items %}
<tr><td>{{e.full_name}}</td><td>{{e.email}}</td><td>{{e.role}}</td><td>{{e.department.name}}</td><td><span class="badge {{e.status}}">{{e.status}}</span></td><td>
<form method="post" action="{{ url_for('update_employee', emp_id=e.id) }}" class="d-inline">
<select name="status" class="form-select form-select-sm d-inline w-auto"><option>active</option><option>inactive</option></select>
<button class="btn btn-sm btn-warning">Update</button></form>
<form method="post" action="{{ url_for('delete_employee', emp_id=e.id) }}" class="d-inline"><button class="btn btn-sm btn-danger">Delete</button></form>
</td></tr>
{% endfor %}
</table>
{% include '_pagination.html' %}
{% endblock %}
