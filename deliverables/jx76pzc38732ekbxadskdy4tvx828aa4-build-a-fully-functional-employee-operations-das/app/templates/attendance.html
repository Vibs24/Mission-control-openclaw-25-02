{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-2"><h4>Attendance</h4><a class="btn btn-outline-secondary" href="{{ url_for('export_csv', table='attendance') }}">Export CSV</a></div>
<form method="post" class="row g-2 mb-3">
  <div class="col"><select class="form-select" name="employee_id">{% for e in employees %}<option value="{{e.id}}">{{e.full_name}}</option>{% endfor %}</select></div>
  <div class="col"><input type="date" class="form-control" name="day" required></div>
  <div class="col"><input class="form-control" name="check_in" placeholder="09:00"></div>
  <div class="col"><input class="form-control" name="check_out" placeholder="18:00"></div>
  <div class="col"><select class="form-select" name="status"><option>present</option><option>absent</option><option>half_day</option></select></div>
  <div class="col-auto"><button class="btn btn-success">Mark</button></div>
</form>
<table class="table table-striped table-sm"><tr><th>Employee</th><th>Day</th><th>Status</th><th>In</th><th>Out</th></tr>
{% for a in rows.items %}<tr><td>{{a.employee.full_name}}</td><td>{{a.day}}</td><td><span class="badge {{a.status}}">{{a.status}}</span></td><td>{{a.check_in}}</td><td>{{a.check_out}}</td></tr>{% endfor %}
</table>
{% include '_pagination.html' %}
{% endblock %}
