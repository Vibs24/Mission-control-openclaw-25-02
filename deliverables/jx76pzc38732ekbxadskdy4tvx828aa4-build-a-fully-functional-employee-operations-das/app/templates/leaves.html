{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-2"><h4>Leave Requests</h4><a class="btn btn-outline-secondary" href="{{ url_for('export_csv', table='leaves') }}">Export CSV</a></div>
<form class="row g-2 mb-2"><div class="col"><select name="status" class="form-select"><option value="">All</option><option>pending</option><option>approved</option><option>rejected</option></select></div><div class="col-auto"><button class="btn btn-primary">Filter</button></div></form>
<form method="post" class="row g-2 mb-3">
  <div class="col"><select class="form-select" name="employee_id">{% for e in employees %}<option value="{{e.id}}">{{e.full_name}}</option>{% endfor %}</select></div>
  <div class="col"><input type="date" class="form-control" name="start_date" required></div>
  <div class="col"><input type="date" class="form-control" name="end_date" required></div>
  <div class="col"><input class="form-control" name="reason" placeholder="Reason"></div>
  <div class="col-auto"><button class="btn btn-success">Submit</button></div>
</form>
<table class="table table-striped table-sm"><tr><th>Employee</th><th>From</th><th>To</th><th>Status</th><th>Actions</th></tr>
{% for l in rows.items %}<tr><td>{{l.employee.full_name}}</td><td>{{l.start_date}}</td><td>{{l.end_date}}</td><td><span class="badge {{l.status}}">{{l.status}}</span></td><td>
<form method="post" action="{{ url_for('update_leave', leave_id=l.id) }}" class="d-inline"><select name="status" class="form-select form-select-sm d-inline w-auto"><option>pending</option><option>approved</option><option>rejected</option></select><button class="btn btn-sm btn-warning">Update</button></form></td></tr>{% endfor %}
</table>
{% include '_pagination.html' %}
{% endblock %}
