{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-2"><h4>Departments</h4><a class="btn btn-outline-secondary" href="{{ url_for('export_csv', table='employees') }}">Export Employees CSV</a></div>
<form class="row g-2 mb-2"><div class="col"><input class="form-control" name="q" value="{{q}}" placeholder="Search department"></div><div class="col-auto"><button class="btn btn-primary">Search</button></div></form>
<form method="post" class="row g-2 mb-3">
  <div class="col"><input class="form-control" name="name" placeholder="Department name" required></div>
  <div class="col"><input class="form-control" name="location" placeholder="Location"></div>
  <div class="col-auto"><button class="btn btn-success">Add</button></div>
</form>
<table class="table table-striped table-sm"><tr><th>Name</th><th>Location</th><th></th></tr>
{% for d in rows.items %}<tr><td>{{d.name}}</td><td>{{d.location}}</td><td><form method="post" action="{{ url_for('delete_department', dep_id=d.id) }}"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}
</table>
{% include '_pagination.html' %}
{% endblock %}
