{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-2"><h4>Tasks</h4><a class="btn btn-outline-secondary" href="{{ url_for('export_csv', table='tasks') }}">Export CSV</a></div>
<form class="row g-2 mb-2"><div class="col"><select name="status" class="form-select"><option value="">All</option><option>todo</option><option>in_progress</option><option>done</option></select></div><div class="col-auto"><button class="btn btn-primary">Filter</button></div></form>
<form method="post" class="row g-2 mb-3">
  <div class="col"><input class="form-control" name="title" placeholder="Task title" required></div>
  <div class="col"><select class="form-select" name="employee_id">{% for e in employees %}<option value="{{e.id}}">{{e.full_name}}</option>{% endfor %}</select></div>
  <div class="col"><select class="form-select" name="priority"><option>low</option><option selected>medium</option><option>high</option></select></div>
  <div class="col"><input type="date" class="form-control" name="due_date"></div>
  <div class="col-auto"><button class="btn btn-success">Add</button></div>
</form>
<table class="table table-striped table-sm"><tr><th>Title</th><th>Employee</th><th>Priority</th><th>Status</th><th>Due</th><th>Actions</th></tr>
{% for t in rows.items %}<tr><td>{{t.title}}</td><td>{{t.employee.full_name}}</td><td>{{t.priority}}</td><td><span class="badge {{t.status}}">{{t.status}}</span></td><td>{{t.due_date}}</td><td>
<form method="post" action="{{ url_for('update_task', task_id=t.id) }}" class="d-inline"><select class="form-select form-select-sm d-inline w-auto" name="status"><option>todo</option><option>in_progress</option><option>done</option></select><button class="btn btn-sm btn-warning">Update</button></form>
<form method="post" action="{{ url_for('delete_task', task_id=t.id) }}" class="d-inline"><button class="btn btn-sm btn-danger">Delete</button></form>
</td></tr>{% endfor %}
</table>
{% include '_pagination.html' %}
{% endblock %}
