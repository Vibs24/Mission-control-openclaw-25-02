<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Ops Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">EmployeeOps</a>
    {% if current_user.is_authenticated %}
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('departments') }}">Departments</a>
      <a class="nav-link" href="{{ url_for('employees') }}">Employees</a>
      <a class="nav-link" href="{{ url_for('tasks') }}">Tasks</a>
      <a class="nav-link" href="{{ url_for('attendance') }}">Attendance</a>
      <a class="nav-link" href="{{ url_for('leaves') }}">Leaves</a>
      <a class="nav-link" href="{{ url_for('audit') }}">Audit</a>
      <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
    </div>
    {% endif %}
  </div>
</nav>
<div class="container">
  {% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat,msg in msgs %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
