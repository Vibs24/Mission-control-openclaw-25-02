<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Ops</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
<nav>
  <h2>Employee Ops</h2>
  {% if current_user.is_authenticated %}
  <div class="links">
    <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('main.employees') }}">Employees</a>
    <a href="{{ url_for('main.departments') }}">Departments</a>
    <a href="{{ url_for('main.tasks') }}">Tasks</a>
    <a href="{{ url_for('main.attendance') }}">Attendance</a>
    <a href="{{ url_for('main.leaves') }}">Leaves</a>
    <a href="{{ url_for('main.logout') }}">Logout</a>
  </div>
  {% endif %}
</nav>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="alert {{category}}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
