{% if rows.pages > 1 %}
<nav><ul class="pagination pagination-sm">
  {% for p in rows.iter_pages() %}
    {% if p %}
    <li class="page-item {% if p==rows.page %}active{% endif %}"><a class="page-link" href="{{ request.path }}?{{ request.query_string.decode('utf-8')|replace('page=' ~ rows.page|string, '') }}&page={{p}}">{{p}}</a></li>
    {% endif %}
  {% endfor %}
</ul></nav>
{% endif %}
