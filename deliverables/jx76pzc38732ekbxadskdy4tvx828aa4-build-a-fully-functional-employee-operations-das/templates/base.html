<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Ops</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
{% if current_user.is_authenticated %}
<nav class="topnav">
  <a href="{{ url_for('dashboard') }}">Dashboard</a>
  <a href="{{ url_for('employees') }}">Employees</a>
  <a href="{{ url_for('departments') }}">Departments</a>
  <a href="{{ url_for('tasks') }}">Tasks</a>
  <a href="{{ url_for('attendance') }}">Attendance</a>
  <a href="{{ url_for('leaves') }}">Leaves</a>
  <a href="{{ url_for('audit') }}">Audit</a>
  <a href="{{ url_for('logout') }}">Logout</a>
</nav>
{% endif %}
<div class="container">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</div>
</body></html>
